<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#021419;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{position:fixed;inset:0;width:100%}
button{font:inherit;cursor:pointer}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0b3a44,#021419 70%)}
#phone{--bg:#f2f7f6;--card:#fff;--fg:#0b2a30;--mut:#6b8a8f;--line:#dbe7e6;--acc:#14a094;position:relative;width:410px;height:864px;flex:none;padding:10px;border-radius:60px;background:linear-gradient(145deg,#33565d,#0c1d22 45%,#2a4b52);box-shadow:0 0 0 2px #5b8189 inset,0 30px 80px #000c}

.side{position:absolute;width:7px;border-radius:3px;background:linear-gradient(90deg,#78a0a7,#2a474d);transition:transform .08s;z-index:3;touch-action:none}
.side::before{content:"";position:absolute;inset:-8px -12px}
#pwr{right:-5px;top:210px;height:96px}
#vup{left:-5px;top:180px;height:58px}
#vdn{left:-5px;top:250px;height:58px}
#pwr.pressed{transform:translateX(-3px)}
#vup.pressed,#vdn.pressed{transform:translateX(3px)}
#screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#000;isolation:isolate;transform:translateZ(0);touch-action:none;color:#fff}
#wall{position:absolute;inset:0;z-index:0}
#wall::after{content:"";position:absolute;inset:0;background-image:var(--scale);background-size:44px 44px;opacity:.13}
#wall svg{position:absolute;width:340px;left:25px;bottom:150px;color:#fff;opacity:.09}
#island{position:absolute;top:12px;left:50%;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:16px;z-index:9}
#status{position:absolute;top:0;left:0;right:0;height:54px;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0 30px;font-weight:600;font-size:16px;pointer-events:none}
#screen[data-s=app] #status{color:var(--fg)}
#status span{display:flex;align-items:center;gap:6px}
#home{position:absolute;inset:0;z-index:1;padding:88px 22px 0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:94px;gap:14px 4px;align-content:start}
.ic{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;height:90px}
.ic u{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;box-shadow:0 6px 14px #0006}
.ic svg{width:32px;height:32px}

.enter .ic{animation:pop .45s both cubic-bezier(.2,.9,.3,1.2);animation-delay:calc(var(--i)*60ms + 120ms)}

#lock{position:absolute;inset:0;z-index:5;text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:92px;will-change:transform}
#lock .lg{width:40px;height:40px;opacity:.95}

.note{width:326px;padding:12px 16px;border-radius:18px;background:#ffffff26;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:left;font-size:14px;line-height:1.4}
.note b{display:block;font-size:15px}
#hint{margin-top:22px;font-size:14px;opacity:.9;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px);opacity:.6}}
#ubtn{margin:14px 0 50px;padding:10px 34px;border-radius:22px;border:1px solid #fff8;background:#ffffff22;color:#fff;font-size:16px}
.app{position:absolute;inset:0;z-index:2;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding-top:54px;border-radius:50px;transform:scale(.9);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.3,.8,.3,1),opacity .28s}
.app.open{transform:none;opacity:1;pointer-events:auto}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 14px 10px;font-weight:700;font-size:19px}

.grp{margin:10px 16px;background:var(--card);border-radius:16px;overflow:hidden}

.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}

.seg{display:flex;gap:8px;margin:10px 16px}

.seg .on{border-color:var(--acc);color:var(--acc);font-weight:700}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 16px}

.wt.on{border-color:var(--acc)}
.inp{width:calc(100% - 32px);margin:10px 16px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);padding:0 12px;font-size:16px;-webkit-user-select:text;user-select:text}
.btn{display:block;width:calc(100% - 32px);margin:10px 16px;padding:13px;border-radius:14px;border:0;background:var(--card);color:#d6453d;font-size:16px}
.bbar{display:flex;gap:8px;padding:2px 12px 8px}

.bbar input{flex:1;min-width:0;height:40px;border-radius:12px;border:0;background:var(--card);color:var(--fg);padding:0 12px;font-size:16px;-webkit-user-select:text;user-select:text}
#bform{flex:1;display:flex;min-width:0}
#brc{flex:1;min-height:0;position:relative;background:var(--bg)}
#brc.fr{display:flex;flex-direction:column;overflow:hidden}

.exbar a{color:var(--acc);font-weight:700}
.tb{display:flex;justify-content:space-around;padding:6px 0 32px;border-top:1px solid var(--line);background:var(--card)}
.tb button{background:none;border:0;color:var(--fg);font-size:24px;width:52px;height:40px}
.tb button:disabled{opacity:.28}
#btabs{font-size:14px;font-weight:700}#btabs b{display:inline-block;width:24px;height:24px;line-height:21px;border:2px solid var(--fg);border-radius:6px}
.page{padding:18px 20px;font-size:var(--fs,16px);line-height:1.65;color:var(--fg)}
.page h2{margin-bottom:8px}.page p{margin:8px 0}.mut,.page small{color:var(--mut)}
.page a{color:var(--acc);font-weight:600;text-decoration:none}
.bh{text-align:center;padding-top:16px}.bh svg{width:78px;height:78px;color:var(--acc)}

.sbox button{border:0;border-radius:22px;background:var(--acc);color:#fff;padding:0 18px;font-size:15px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick a{padding:8px 14px;border-radius:18px;background:var(--card)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.bgrid a{background:var(--card);border-radius:14px;padding:14px 6px;font-size:13px;text-align:center;word-break:break-all}
.bmr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.bmr a{flex:1;min-width:0;display:block;word-break:break-all}.bmr small{display:block;font-weight:400}
.bmr button{background:none;border:0;color:var(--mut);font-size:18px}
#tabs{position:absolute;inset:54px 0 0;z-index:4;background:var(--bg);display:none;flex-direction:column;border-radius:0 0 50px 50px}

.tc.on{border-color:var(--acc)}.tc small{color:var(--mut);font-size:11px}

#tfoot{padding:8px 16px 36px;display:flex;gap:10px}

#ntx{flex:1;margin:4px 16px 44px;border:0;border-radius:16px;background:var(--card);color:var(--fg);padding:16px;font-size:17px;line-height:1.6;resize:none;outline:none;-webkit-user-select:text;user-select:text}
#bar{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:9;touch-action:none}
#bar::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff;opacity:.85}

#menu{position:absolute;inset:0;z-index:11;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}

#dlg{position:absolute;inset:0;z-index:12;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}

.mcard{width:290px;background:#10282e;border-radius:26px;padding:22px 18px;color:#fff;text-align:center}
.mcard h3{margin-bottom:14px}
.mcard button{display:block;width:100%;padding:14px;margin-top:10px;border-radius:14px;border:0;background:#1d4a52;color:#fff;font-size:17px}
.mcard button[data-pw=off]{background:#c8423b}
.mcard .gh{background:none;color:#9fc5c9}
#off,#boot{position:absolute;inset:0;background:#000;display:none;z-index:12}
#boot{z-index:13;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}

#boot small{opacity:.6;letter-spacing:1px}

#lnotes{margin-top:auto;display:flex;flex-direction:column;gap:8px}
input[type=range]{width:100%;accent-color:var(--acc);touch-action:none;margin-top:8px}
.sl{margin:10px 16px;padding:12px 16px;background:var(--card);border-radius:16px;font-size:16px}

#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:14}
#ccz{position:absolute;top:0;right:0;width:45%;height:36px;z-index:9;touch-action:none}

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const KEY='qene.v1';
const D={kb:'fish',pass:'1234',passOn:false,cell:true,carrier:'kiwe',land:false,msgs:{},calls:[],ver:'1.0',autoUpd:true,custom:'',useCustom:false,scales:true,shot:'',camFront:0,grid:false,mirror:true,shutSnd:true,bright:1,ccOn:true,ccApp:true,notif:true,notifLock:true,banner:true,nsound:true,click:true,lockSnd:true,tone:660,focus:'',usage:{},limit:0,h24:true,abig:false,abold:false,acon:false,anomo:false,labels:true,icsz:0,addHome:true,inst:[],gSwipe:true,gBar:true,fed:0,dark:false,wifi:true,bt:true,vol:50,wall:0,home:'qene:home',bmHome:true,fs:16,net:'QeneFish-5G',btDev:true,note:'',bm:[{t:'青魚說明',u:'qene:about'},{t:'維基百科',u:'https://zh.wikipedia.org'}]};
let S=JSON.parse(JSON.stringify(D));
try{const sv=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(S,sv);if(!('cell' in sv)&&sv.pass==='1234')S.passOn=false}catch(e){}
const CARR={kiwe:'kiwe通訊',north:'北魚通訊'};
const carName=()=>CARR[S.carrier]||CARR.kiwe;
const online=()=>!!(S.wifi||S.cell);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const R={on:true,awake:true,stage:'lock',busy:false,sc:1,cur:null,t0:0,dl:{},stream:null,nl:[{t:'歡迎使用青魚手機',b:'這是網頁模擬器，不是真正的手機系統。'}]};
const phone=$('#phone'),scr=$('#screen'),lock=$('#lock'),home=$('#home');
const WALLS=[{n:'深海',c:'linear-gradient(170deg,#0e5a66 0%,#06242b 58%,#021419)'},{n:'潮光',c:'linear-gradient(160deg,#25b8a8,#0d6b78 52%,#073a47)'},{n:'夕鱗',c:'linear-gradient(165deg,#e8794f,#a63f6b 52%,#2f2459)'},{n:'霧灣',c:'linear-gradient(170deg,#4f9fa6,#2f7584 55%,#1b4656)'}];
const scaleSvg="<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><g fill='none' stroke='white' stroke-width='1.5'><circle cx='0' cy='0' r='22'/><circle cx='44' cy='0' r='22'/><circle cx='22' cy='22' r='22'/><circle cx='0' cy='44' r='22'/><circle cx='44' cy='44' r='22'/></g></svg>";
$('#wall').style.setProperty('--scale','url("data:image/svg+xml,'+encodeURIComponent(scaleSvg)+'")');

/* ---------- 版面縮放 ---------- */
function fit(){const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;const LW=S.land?884:428,LH=S.land?428:884;R.sc=Math.min(w/LW,h/LH,1.2);phone.style.transform=R.demo?'scale('+R.sc*.85+') rotateX('+V.x+'deg) rotateY('+V.y+'deg)':'scale('+R.sc+')'}
addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
document.addEventListener('touchmove',e=>{if(!e.target.closest('.scroll,textarea,#tgrid,#cc,#pv'))e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- 狀態套用 ---------- */
function applyAll(){phone.classList.toggle('land',!!S.land);fit();phone.dataset.theme=S.dark?'dark':'light';const w=$('#wall');w.style.background=S.useCustom&&S.custom?'center/cover url('+S.custom+')':WALLS[S.wall].c;w.classList.toggle('noscale',!S.scales);$('#sw').style.display=S.wifi?'':'none';$('#ssig').style.display=S.cell?'':'none';$('#scar').textContent=S.cell?carName():'';$('#sb').style.display=S.bt?'':'none';$('#sf').style.display=S.focus?'':'none';phone.style.setProperty('--fs',S.fs+'px');['abig','abold','acon','anomo'].forEach(k=>phone.classList.toggle(k,!!S[k]));phone.classList.toggle('nolabel',!S.labels);phone.classList.toggle('bigic',S.icsz===1);phone.classList.toggle('nobar',!S.gBar);$('#dim').style.opacity=(1-S.bright)*.75;$('#hint').style.display=S.gSwipe?'':'none'}
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0'),t=d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hourCycle:S.h24?'h23':'h12'});$('#stime').textContent=t;$('#ltime').textContent=t;$('#ldate').textContent=d.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});wcR()}
setInterval(tick,1000);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}

/* ---------- 聲音與音量 ---------- */
let ac;function beep(f){if(S.vol===0)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f||S.tone;g.gain.value=S.vol/100*0.2;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}catch(e){}}
let ht;function hud(){$('#hv').textContent=S.vol+'%';$('#hf').style.width=S.vol+'%';$('#hi').textContent=S.vol?'♪':'✕';const h=$('#hud');h.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>h.classList.remove('show'),1600)}
function vol(d){if(!R.on||R.busy)return;S.vol=Math.max(0,Math.min(100,S.vol+d));save();beep(400+S.vol*5);if(R.awake)hud()}
function key(el,fn){let on=false;el.addEventListener('pointerdown',e=>{e.preventDefault();on=true;try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('pressed');fn()});['pointerup','pointercancel'].forEach(t=>el.addEventListener(t,()=>{on=false;el.classList.remove('pressed')}))}

const bootEl=$('#boot'),offEl=$('#off'),menu=$('#menu');
function showBoot(txt,prog){bootEl.classList.add('show');$('#bt').textContent=txt||'QENE FISH PHONE';const p=$('#pgb');p.classList.remove('run');p.style.visibility=prog?'visible':'hidden';if(prog){void p.offsetWidth;p.classList.add('run')}}
function resetToLock(){flush();camStop();stopCall();passHide();lrender();$('#cc').classList.remove('show');$('#tabs').classList.remove('show');$$('.app').forEach(a=>a.classList.remove('open'));R.stage='lock';scr.dataset.s='lock';lock.style.transition='none';lock.style.transform='';lock.style.opacity=1;lock.style.pointerEvents='';home.classList.remove('enter');menu.classList.remove('show');$('#dlg').classList.remove('show');dlgCb=null;tick()}
function sleep(){flush();camStop();stopCall();R.awake=false;offEl.classList.add('show');menu.classList.remove('show')}
function wake(){R.awake=true;resetToLock();offEl.classList.remove('show')}
async function powerOff(){flush();camStop();R.busy=true;menu.classList.remove('show');showBoot('正在關機…',false);await wait(1400);R.on=false;R.awake=false;offEl.classList.add('show');bootEl.classList.remove('show');R.busy=false}
async function reboot(){R.busy=true;menu.classList.remove('show');showBoot('正在重新啟動…',false);await wait(1400);showBoot('',true);await wait(2000);finish()}
async function powerOn(){R.busy=true;showBoot('',true);await wait(2000);finish()}
function finish(){setTimeout(autoChk,1500);R.on=true;R.awake=true;resetToLock();offEl.classList.remove('show');bootEl.classList.remove('show');R.busy=false}
function onShort(){if(R.busy)return;if(menu.classList.contains('show'))return menu.classList.remove('show');if(!R.on)powerOn();else if(R.awake)sleep();else wake()}
function onLong(){if(R.busy)return;if(!R.on)powerOn();else if(!R.awake)wake();else menu.classList.add('show')}
(()=>{const el=$('#pwr');let pt,lp=false,down=false;
el.addEventListener('pointerdown',e=>{e.preventDefault();down=true;lp=false;try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('pressed');clearTimeout(pt);pt=setTimeout(()=>{lp=true;onLong()},650)});
el.addEventListener('pointerup',()=>{if(!down)return;down=false;clearTimeout(pt);el.classList.remove('pressed');if(!lp)onShort()});
el.addEventListener('pointercancel',()=>{down=false;clearTimeout(pt);el.classList.remove('pressed')})})();
menu.addEventListener('click',e=>{const b=e.target.closest('[data-pw]');if(b){const a=b.dataset.pw;if(a==='off')powerOff();else if(a==='reboot')reboot();else menu.classList.remove('show')}else if(e.target===menu)menu.classList.remove('show')});

$('#sc').addEventListener('click',e=>{const t=e.target;let b;
if(b=t.closest('[data-nav]')){stack.push(b.dataset.nav);srender();$('#sc').scrollTop=0}

function pvClose(){const v=$('#pv'),m=v.querySelector('video');if(m){m.pause();m.removeAttribute('src');m.load()}v.style.display='none';v.innerHTML='';pv=-1}
function pvR(){const it=M[pv];if(!it)return pvClose();const b=$('#pv'),o=b.querySelector('video');if(o)o.pause();b.innerHTML=`<div id="pn"><button data-pv="x">完成</button><span><button data-pv="p" ${pv<1?'disabled':''}>‹</button>${pv+1} / ${M.length}<button data-pv="n" ${pv>=M.length-1?'disabled':''}>›</button></span><button data-pv="d" style="color:#d6453d">刪除</button></div><div id="pm">${it.type==='video'?`<video src="${mu(it)}" controls playsinline></video>`:`<img src="${mu(it)}" alt="${esc(it.name)}">`}</div>`;b.style.display='flex'}
$('#pic').addEventListener('click',e=>{let b;if(b=e.target.closest('[data-pi]')){pv=+b.dataset.pi;pvR()}else if(b=e.target.closest('[data-pv]')){const a=b.dataset.pv;if(a==='x')pvClose();else if(a==='p'&&pv>0){pv--;pvR()}else if(a==='n'&&pv<M.length-1){pv++;pvR()}else if(a==='d'){const i=pv,it=M[i];if(!it)return;ask('刪除','確定要刪除這個項目嗎？','刪除',()=>{if(M[i]!==it)return;pvClose();try{URL.revokeObjectURL(U2[it.id])}catch(_){}delete U2[it.id];M.splice(i,1);mtx('readwrite',s=>s.delete(it.id));picR()})}}});
$('#pf').addEventListener('change',async e=>{const fl=[...e.target.files];e.target.value='';if(!fl.length)return;await mready;let ok=0,bad=0,fail=0;for(const f of fl){const t=f.type.startsWith('video/')?'video':f.type.startsWith('image/')?'image':null;if(!t){bad++;continue}const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:t,name:f.name,ts:Date.now(),blob:f};M.unshift(it);ok++;if(!(await mtx('readwrite',s=>s.put(it))))fail++}picR();toast(fail?'已加入，但無法永久儲存':bad?'已加入 '+ok+' 項，'+bad+' 項格式不支援':'已加入 '+ok+' 項')});

/* ---------- 展示模式 ---------- */
const V={x:-8,y:0,vy:0},ov=$('#demoov');
function demoOn(){if(R.busy||!R.on||!R.awake)return;if(!$('#slab')){const sb=document.createElement('div');sb.id='slab';for(let z=-20;z<=20;z+=2){const d=document.createElement('div');d.style.transform='translateZ('+z+'px)';sb.appendChild(d)}phone.insertBefore(sb,$('#back'))}resetToLock();R.demo=true;V.x=-8;V.y=0;V.vy=0;phone.classList.add('demo');ov.style.display='block';$('#demobar').style.display='flex';$('#demohint').style.display='block';fit()}
function demoOff(){R.demo=false;V.vy=0;phone.classList.remove('demo','ease');ov.style.display='none';$('#demobar').style.display='none';$('#demohint').style.display='none';fit()}
(()=>{let d=false,px=0,py=0;
ov.addEventListener('pointerdown',e=>{phone.classList.remove('ease');d=true;px=e.clientX;py=e.clientY;V.vy=0;try{ov.setPointerCapture(e.pointerId)}catch(_){}});
ov.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;V.y+=dx*.6;V.x=Math.max(-60,Math.min(60,V.x-dy*.5));V.vy=dx*.6;fit()});
const up=()=>{if(!d)return;d=false;const f=()=>{if(!R.demo||d||Math.abs(V.vy)<.05)return;V.y+=V.vy;V.vy*=.95;fit();requestAnimationFrame(f)};f()};
ov.addEventListener('pointerup',up);ov.addEventListener('pointercancel',up)})();
$('#demobar').addEventListener('click',e=>{const b=e.target.closest('[data-d3]');if(!b)return;const a=b.dataset.d3;if(a==='x')return demoOff();phone.classList.add('ease');V.vy=0;V.x=-8;V.y=a==='f'?Math.round(V.y/360)*360:Math.round((V.y-180)/360)*360+180;fit();setTimeout(()=>phone.classList.remove('ease'),700)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&R.demo)demoOff()});
$('#sc').addEventListener('click',e=>{if(e.target.closest('[data-act=demo]'))ask('展示模式','進入後只顯示鎖定畫面，可拖曳旋轉手機，轉到背面看鏡頭。','進入',demoOn)});

const GM='games/index.html',gf=$('#gf');
function gmLoad(){$('#gmm').style.display='none';gf.style.display='block';gf.src=GM}
addEventListener('message',e=>{const m=e.data;if(m&&m.qene==='notify'&&e.source===gf.contentWindow&&typeof m.t==='string')notify(m.t.slice(0,60),String(m.b==null?'':m.b).slice(0,120))});
function gmUnload(){const a=gf.getAttribute('src');if(a&&a!=='about:blank')gf.src='about:blank'}
$('#gm').addEventListener('click',e=>{if(e.target.closest('[data-gm=menu]')&&gf.style.display!=='none')gf.src=GM});
S.inst=(S.inst||[]).filter(id=>STORE.some(a=>a.id===id));

applyAll();tick();srender();bshow();homeRender();strender();resetToLock();setTimeout(autoChk,4000);
})();
